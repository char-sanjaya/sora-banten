    <!-- Menggunakan Bootstrap 5 dari CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1596401057633-54a8fe8ef647?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            height: 60vh;
            display: flex;
            align-items: center;
            color: white;
        }
        .footer { 
            background-color: #212529; 
            color: #ccc; 
            padding: 30px 0; 
            margin-top: 80px; 
        }
        .card-img-top { 
            height: 200px; 
            object-fit: cover; 
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<!-- Header / Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand text-warning" href="index.html">SoraBanten.</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="packages.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="estimator.html">Estimasi Biaya</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        <li class="nav-item"><a class="btn btn-outline-warning ms-lg-3 mt-2 mt-lg-0" href="login.html">Login/Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content Area -->

<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Hubungi Kami</h2>
                <p class="text-muted">Punya pertanyaan atau ingin request custom tour? </p>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <!-- Form akan dihubungkan ke database nanti -->
                    <form action="#" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary small fw-bold">Nama Lengkap</label>
                                <input type="text" class="form-control bg-light" placeholder="Masukkan nama..." required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary small fw-bold">Email</label>
                                <input type="email" class="form-control bg-light" placeholder="nama@email.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Subjek Pesan</label>
                            <input type="text" class="form-control bg-light" placeholder="Misal: Penawaran Outing Kantor" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">Isi Pesan</label>
                            <textarea class="form-control bg-light" rows="5" placeholder="Tuliskan detail pertanyaan atau rencana Anda..." required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-dark fw-bold px-5">Kirim Pesan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer text-center">
